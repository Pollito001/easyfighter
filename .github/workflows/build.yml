# Arma los ejecutables para Windows, macOS y Linux en las máquinas de GitHub.
#  - A mano: pestaña «Actions» del repo → «Ejecutables» → «Run workflow». Los archivos quedan en el resumen
#    de esa corrida («Artifacts»).
#  - Con una versión: al subir una etiqueta (git tag v1.0 && git push origin v1.0) además crea un «Release»
#    con los archivos listos para descargar.
name: Ejecutables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04      # una versión de Linux no tan nueva: así corre también en distros más viejas
            appimage: true
          - os: macos-latest      # Mac con Apple Silicon (M1/M2/M3…)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: appimagetool (solo Linux)
        if: matrix.appimage
        run: |
          # libxcb-cursor0 y xcb-util: Qt las necesita para abrir en X11 y no todas las distros las traen,
          # así que van dentro del programa; «file» lo pide appimagetool
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 file
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Versión
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VER=${GITHUB_REF_NAME}" >> $GITHUB_ENV;
          else echo "VER=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV; fi

      - name: Armar
        shell: bash
        run: python packaging/build.py --version "$VER" ${{ matrix.appimage && '--appimage' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ejecutable-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
